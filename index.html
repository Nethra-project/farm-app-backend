<!-- TAB 1: AUTHENTICATION -->
<div id="auth" class="tab-content active">
    <div class="grid">
        <div class="card">
            <h3>Account Registration</h3>
            <input type="text" id="reg-phone" placeholder="Phone Number">
            <input type="email" id="reg-email" placeholder="Email (Optional)">
            <input type="password" id="reg-pass" placeholder="Password">
            
            <!-- Main Role Selection -->
            <select id="reg-role" onchange="toggleRoleFields()">
                <option value="farmer">Farmer</option>
                <option value="fpo">FPO</option>
                <option value="buyer">Buyer</option>
                <option value="driver">Driver</option>
            </select>

            <!-- Dynamic Buyer Options (Hidden by default) -->
            <div id="buyer-type-container" style="display: none; border-top: 1px dashed #ccc; margin-top: 10px; padding-top: 10px;">
                <label style="font-size: 12px; font-weight: bold; color: #555;">BUYER CATEGORY</label>
                <select id="reg-buyer-type" onchange="toggleBulkBuyerFields()">
                    <option value="consumer">Retail / Consumer Buyer</option>
                    <option value="bulk_buyer">Bulk Buyer (Business / Wholesale)</option>
                </select>

                <!-- Additional Bulk Buyer Fields -->
                <div id="bulk-buyer-fields" style="display: none;">
                    <input type="text" id="reg-business-name" placeholder="Business / Restaurant / Hotel Name">
                    <select id="reg-business-type">
                        <option value="restaurant">Restaurant</option>
                        <option value="hotel">Hotel</option>
                        <option value="mess">Mess / Canteen</option>
                        <option value="retailer">Retailer / Supermarket</option>
                        <option value="processor">Food Processor</option>
                        <option value="other">Other</option>
                    </select>
                    <input type="text" id="reg-gstin" placeholder="GSTIN (Optional for Bulk)">
                    <input type="text" id="reg-monthly-qty" placeholder="Approx. Monthly Requirement (e.g. 500 kg)">
                </div>
            </div>

            <button class="btn-submit" onclick="handleRegister()">Create Account</button>
        </div>

        <div class="card">
            <h3>Account Login</h3>
            <input type="text" id="login-phone" placeholder="Phone Number">
            <input type="password" id="login-pass" placeholder="Password">
            <button class="btn-submit" onclick="handleLogin()">Login</button>
        </div>
    </div>
</div>
