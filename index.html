<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishi Bazaar Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        header { background: #1b5e20; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }
        .container { max-width: 800px; margin: 20px auto; }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: white; padding: 25px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #1b5e20; }
        .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .role-card { background: #e8f5e9; border: 2px solid #c8e6c9; padding: 20px; text-align: center; border-radius: 6px; cursor: pointer; font-weight: bold; color: #1b5e20; }
        .role-card:hover { background: #c8e6c9; }
        #console { background: #1e1e1e; color: #4af626; padding: 15px; font-family: monospace; white-space: pre-wrap; border-radius: 6px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

    <header>
        <h2 id="ui-title">🌾 Krishi Bazaar</h2>
        <div>
            <button onclick="toggleLang()" style="width: auto; padding: 6px 12px; background: white; color: #1b5e20;">हिंदी / English</button>
            <button id="logout-btn" onclick="logout()" style="display:none; width: auto; padding: 6px 12px; background: #c62828; margin-left: 10px;">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- Landing View -->
        <div id="view-landing" class="view active">
            <div class="card" style="text-align: center; padding: 40px;">
                <h1 id="ui-hero">Direct Agricultural Marketplace</h1>
                <p>Select an action to get started:</p>
                <button style="width: 200px; margin: 10px;" onclick="showView('view-role-select')">Sign Up</button>
                <button style="width: 200px; margin: 10px; background: #0288d1;" onclick="showView('view-login')">Log In</button>
            </div>
        </div>

        <!-- Role Select View -->
        <div id="view-role-select" class="view">
            <div class="card">
                <h3>Select Your Role</h3>
                <div class="role-grid">
                    <div class="role-card" onclick="setupSignup('farmer')">👨‍🌾 Farmer</div>
                    <div class="role-card" onclick="setupSignup('fpo')">🏛️ FPO</div>
                    <div class="role-card" onclick="setupSignup('consumer')">🛒 Consumer</div>
                    <div class="role-card" onclick="setupSignup('bulk_buyer')">🏢 Bulk Buyer</div>
                    <div class="role-card" onclick="setupSignup('driver')">🚚 Delivery Driver</div>
                </div>
                <button style="background: #616161; margin-top: 15px;" onclick="showView('view-landing')">Back</button>
            </div>
        </div>

        <!-- Signup View -->
        <div id="view-signup" class="view">
            <div class="card">
                <h3 id="signup-header">Registration</h3>
                <div id="signup-form-fields"></div>
                <div style="border-top: 1px solid #eee; margin-top: 15px; padding-top: 15px;">
                    <input type="text" id="su-phone" placeholder="Mobile Number (10 digits)">
                    <button style="background: #0288d1;" onclick="requestOTP()">Send Server OTP (Code: 123456)</button>
                    <div id="otp-section" style="display:none; margin-top: 10px;">
                        <input type="text" id="su-otp" placeholder="Enter 6-digit OTP">
                        <button style="background: #388e3c;" onclick="verifyOTP()">Verify OTP</button>
                    </div>
                </div>
                <button id="btn-register" style="margin-top: 15px;" disabled onclick="submitRegistration()">Complete Registration</button>
                <button style="background: #616161;" onclick="showView('view-role-select')">Back</button>
            </div>
        </div>

        <!-- Login View -->
        <div id="view-login" class="view">
            <div class="card" style="max-width: 400px; margin: 0 auto;">
                <h3>Account Login</h3>
                <input type="text" id="login-phone" placeholder="Mobile Number">
                <input type="password" id="login-password" placeholder="Password">
                <button onclick="login()">Login</button>
                <button style="background: #616161;" onclick="showView('view-landing')">Back</button>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="view-dashboard" class="view">
            <div class="card" id="dashboard-body"></div>
        </div>

        <!-- Console -->
        <div class="card">
            <h4>Live API Response Console</h4>
            <div id="console">Ready...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
